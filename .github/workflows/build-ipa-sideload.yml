# 说明：在 GitHub 免费 macOS 云端机器上编译 openOMSI 的 iPhone/iPad 版，
#       产出"未签名 ipa"，之后用签名工具在手机上签名安装。
# 固定编译官方仓库 openOMSI-org/openOMSI 的 v0.3.54 标签（最新版）。
# 因为 macOS 机器紧张（排队15分钟抢不到会被自动取消），本工作流每15分钟
# 自动重试一次；编译成功发布 ipa 后，后续自动运行会快速跳过，不再占用机器。
name: Build unsigned iOS ipa

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/build-ipa-sideload.yml']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ios-unsigned-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: macos-26
    steps:
      - name: 拉取源码（官方仓库 v0.3.54）
        uses: actions/checkout@v7
        with:
          repository: openOMSI-org/openOMSI
          ref: v0.3.54
          fetch-depth: 0

      - name: 安装 Rust（iOS 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 缓存编译产物（第二次跑会快很多）
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-unsigned-sideload

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 编译游戏引擎（Rust → iOS 静态库）
        run: scripts/build-apple.sh rust ios

      - name: 生成 Xcode 工程并编译（不签名）
        run: |
          scripts/build-apple.sh project
          xcodebuild -project apple/openOMSI.xcodeproj -scheme openOMSI-iOS -configuration Release \
            -destination 'generic/platform=iOS' \
            OPENOMSI_RUST_TARGET="$PWD/target" OPENOMSI_SKIP_RUST=1 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build build

      - name: 打包成 ipa
        run: |
          mkdir -p Payload out
          cp -R "build/Build/Products/Release-iphoneos/openOMSI.app" Payload/
          zip -qry "out/openOMSI-unsigned-ios.ipa" Payload
          echo "=== 产物校验 ==="
          ls -lh out/
          unzip -l out/openOMSI-unsigned-ios.ipa | head -5

      - name: 上传 ipa 供下载
        uses: actions/upload-artifact@v7
        with:
          name: openOMSI-unsigned-ipa
          path: out/openOMSI-unsigned-ios.ipa
          retention-days: 14

      - name: 发布到 Release（免登录直接下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ios-unsigned-latest out/openOMSI-unsigned-ios.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "openOMSI iOS 未签名 ipa（v0.3.54）" \
            --notes "自动编译的未签名 iPhone/iPad 版，用于第三方签名工具签名安装。"
