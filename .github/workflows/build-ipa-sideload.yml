# 上传位置说明：这个文件要放到你 Fork 的仓库里，路径必须是
#   .github/workflows/build-ipa-sideload.yml
# 作用：在 GitHub 免费的 macOS 云端机器上编译 openOMSI 的 iPhone/iPad 版，
#       产出一个“未签名 ipa”，之后用 Sideloadly 在 Windows 上签名安装。
# 运行时间预计 40~90 分钟（Rust 引擎要从头编译一遍）。
name: Build unsigned iOS ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: 拉取源码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Rust（iOS 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 缓存编译产物（第二次跑会快很多）
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-unsigned-sideload

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 编译游戏引擎（Rust → iOS 静态库）
        run: scripts/build-apple.sh rust ios

      - name: 生成 Xcode 工程并编译（不签名）
        run: |
          scripts/build-apple.sh project
          xcodebuild -project apple/openOMSI.xcodeproj -scheme openOMSI-iOS -configuration Release \
            -destination 'generic/platform=iOS' \
            OPENOMSI_RUST_TARGET="$PWD/target" OPENOMSI_SKIP_RUST=1 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build build

      - name: 打包成 ipa
        run: |
          mkdir -p Payload out
          cp -R "build/Build/Products/Release-iphoneos/openOMSI.app" Payload/
          zip -qry "out/openOMSI-unsigned-ios.ipa" Payload
          echo "=== 产物校验 ==="
          ls -lh out/
          unzip -l out/openOMSI-unsigned-ios.ipa | head -5

      - name: 上传 ipa 供下载
        uses: actions/upload-artifact@v7
        with:
          name: openOMSI-unsigned-ipa
          path: out/openOMSI-unsigned-ios.ipa
          retention-days: 14
