# 说明：这个工作流在 GitHub 免费 macOS 云端机器上编译 openOMSI 的 iPhone/iPad 版，
#       产出"未签名 ipa"，之后用签名工具在手机上签名安装。
# 触发方式：手动运行，或本文件被推送时自动运行。
# 本次配置固定编译官方仓库 openOMSI-org/openOMSI 的 v0.3.54 标签代码（最新版本）。
# 预计运行 40~90 分钟（Rust 引擎要从头编译一遍，第二次会因缓存快很多）。
name: Build unsigned iOS ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-ipa-sideload.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: 拉取源码（官方仓库 v0.3.54）
        uses: actions/checkout@v7
        with:
          repository: openOMSI-org/openOMSI
          ref: v0.3.54
          fetch-depth: 0

      - name: 安装 Rust（iOS 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 缓存编译产物（第二次跑会快很多）
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-unsigned-sideload

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 编译游戏引擎（Rust → iOS 静态库）
        run: scripts/build-apple.sh rust ios

      - name: 生成 Xcode 工程并编译（不签名）
        run: |
          scripts/build-apple.sh project
          xcodebuild -project apple/openOMSI.xcodeproj -scheme openOMSI-iOS -configuration Release \
            -destination 'generic/platform=iOS' \
            OPENOMSI_RUST_TARGET="$PWD/target" OPENOMSI_SKIP_RUST=1 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            -derivedDataPath build build

      - name: 打包成 ipa
        run: |
          mkdir -p Payload out
          cp -R "build/Build/Products/Release-iphoneos/openOMSI.app" Payload/
          zip -qry "out/openOMSI-unsigned-ios.ipa" Payload
          echo "=== 产物校验 ==="
          ls -lh out/
          unzip -l out/openOMSI-unsigned-ios.ipa | head -5

      - name: 上传 ipa 供下载
        uses: actions/upload-artifact@v7
        with:
          name: openOMSI-unsigned-ipa
          path: out/openOMSI-unsigned-ios.ipa
          retention-days: 14

      - name: 发布到 Release（免登录直接下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-unsigned-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-unsigned-latest out/openOMSI-unsigned-ios.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --title "openOMSI iOS 未签名 ipa（v0.3.54）" \
            --notes "自动编译的未签名 iPhone/iPad 版，用于第三方签名工具签名安装。"
